name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ftn_database
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ftn_database"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate Composer config
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run quality gates
        run: composer test:all

      - name: Run PostgreSQL migration check
        run: vendor/bin/pest tests/Feature/PostgresMigrationTest.php
        env:
          FTN_DATABASE_POSTGRES_DATABASE: ftn_database
          FTN_DATABASE_POSTGRES_HOST: 127.0.0.1
          FTN_DATABASE_POSTGRES_PASSWORD: postgres
          FTN_DATABASE_POSTGRES_PORT: 5432
          FTN_DATABASE_POSTGRES_USERNAME: postgres
